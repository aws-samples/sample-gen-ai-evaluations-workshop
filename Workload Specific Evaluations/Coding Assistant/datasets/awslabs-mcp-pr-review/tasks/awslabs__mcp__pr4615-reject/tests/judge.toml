# Pinned judge configuration. Generated by eval-harvest emit; do not edit by hand.
#
# The judge decides semantic equivalence between a reference finding and an agent finding that
# already agree on file and line. It is pinned here — model and temperature — because a judge that
# varies run to run makes the score irreproducible. The reward-kit override variables
# (REWARDKIT_JUDGE/REWARDKIT_MODEL/…) are scrubbed from the verifier environment by test.sh, and the
# model is read from this file (not the environment), so the pin cannot be silently overridden.

[judge]
provider = "bedrock"
model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
temperature = 0.0
seed = 0
# The verifier calls Bedrock (score.py, LiveJudge) signed with the MicroVM's IAM execution role — there
# is no API key. The region comes from the verifier environment (AWS_REGION); the endpoint is
# https://bedrock-runtime.<region>.amazonaws.com. temperature = 0 is the determinism lever: Bedrock's
# Converse API has no seed parameter, so seed is recorded here but not sent.
