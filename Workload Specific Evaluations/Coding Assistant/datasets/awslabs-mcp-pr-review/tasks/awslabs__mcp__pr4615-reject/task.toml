schema_version = "1.4"

[task]
name = "awslabs/mcp__pr4615-reject"
version = "1.0.0"
description = "Review the change on this pull-request iteration and report the defects a competent reviewer should catch."
keywords = ["pr-review", "eval-harvest"]

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

# The judge in score.py calls Amazon Bedrock with the AWS credentials of the host shell. The judge
# model comes from JUDGE_MODEL_ID in model_config.py (the notebook puts it in the environment). The
# default is used when the variable is not set, for example when you run the task in a terminal.
[verifier.env]
JUDGE_MODEL_ID = "${JUDGE_MODEL_ID:-us.anthropic.claude-haiku-5-5}"
AWS_ACCESS_KEY_ID = "${AWS_ACCESS_KEY_ID:-}"
AWS_SECRET_ACCESS_KEY = "${AWS_SECRET_ACCESS_KEY:-}"
AWS_SESSION_TOKEN = "${AWS_SESSION_TOKEN:-}"
AWS_REGION = "${AWS_REGION:-us-east-1}"

[verifier.environment]
network_mode = "public"
os = "linux"

# The agent can reach only the Bedrock endpoint that Codex uses. It cannot reach GitHub.
[environment]
network_mode = "allowlist"
os = "linux"
allowed_hosts = ["bedrock-mantle.us-east-1.api.aws"]

[metadata.origin]
repo = "awslabs/mcp"
pr_numbers = [4615]
base_commit = "27e3e60edb78d541a7a034d5c3d38f181a79b397"
base_commit_date = ""
merged_at = ""

[metadata.harvest]
kind = "reject"
expected_verdict = "block"
blocking_severity = "high"
finding_severities = ["high", "medium", "medium", "low", "low", "low"]
change_risk_structural = "high"
change_risk_classified = "high"
change_risk_disagreement = false
rubric_version = "v1"
overrides = []
