# Pinned judge configuration. Generated by eval-harvest emit; do not edit by hand.
#
# The judge decides semantic equivalence between a reference finding and an agent finding that
# already agree on file and line. Temperature is pinned here, because a judge that varies run to run
# makes the score irreproducible. The model is the default only: JUDGE_MODEL_ID in the verifier
# environment replaces it (task.toml passes it from model_config.py in the workshop). The model that
# ran is recorded in /logs/verifier/judge.json. The reward-kit override variables
# (REWARDKIT_JUDGE/REWARDKIT_MODEL/…) are still scrubbed by test.sh, so only JUDGE_MODEL_ID can
# change the model.

[judge]
provider = "bedrock"
model = "us.anthropic.claude-haiku-5-5"
# Sent only if the model accepts it: some models (for example Claude Haiku 5.5) reject the
# parameter. judge.json records the temperature that was sent (null if none).
temperature = 0.0
seed = 0
# The verifier calls Bedrock (score.py, LiveJudge) signed with the MicroVM's IAM execution role — there
# is no API key. The region comes from the verifier environment (AWS_REGION); the endpoint is
# https://bedrock-runtime.<region>.amazonaws.com. temperature = 0 is the determinism lever: Bedrock's
# Converse API has no seed parameter, so seed is recorded here but not sent (R-9).
