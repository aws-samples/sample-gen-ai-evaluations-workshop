# Shared file. Edit datasets/_shared/coding/tests/judge/models.toml, then run `python datasets/_shared/sync.py`.
# The settings of each LLM stage of the reward stack. All run on Amazon Bedrock in the Region of the
# verifier (AWS_REGION). The `model` values are defaults: VERIFIER_MODEL_ID in the verifier environment
# (task.toml passes it from model_config.py in the workshop) replaces the model of every stage. The
# model that ran is recorded in reward_details.json. `temperature` is sent only if the model accepts it
# (Claude Haiku 5.5 rejects it); each stage records the temperature that it sent (null if none).

[validation_agent]
model = "us.anthropic.claude-haiku-5-5"
max_turns = 50
max_tokens = 16000
temperature = 0

[validation_judge]
model = "us.anthropic.claude-haiku-5-5"
max_turns = 20
temperature = 0

[rubric_judge]
model = "us.anthropic.claude-haiku-5-5"
max_turns = 16
temperature = 0

[taste_judge]
model = "us.anthropic.claude-haiku-5-5"
max_turns = 30
temperature = 0

# Thresholds of a tasteful solve, after Senior SWE-Bench: rubric > 0.5, bloat < 2x. The taste judge
# answers ten yes/no checks (no 1-5 scale): at least 3 of the 5 checks of each group must pass. Senior
# SWE-Bench uses 1-5 scores with a gate of "more than 2"; a check here passes when a maintainer would
# accept the change on that point, so the bar is about the same: it removes clearly bad changes.
[gates]
rubric_min = 0.5
bloat_max = 2.0
taste_min_pass_rate = 0.6
