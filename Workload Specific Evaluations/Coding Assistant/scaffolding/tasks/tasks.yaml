    issue_description: |
      `src/agentic_platform/agent/langgraph_chat/chat_workflow.py:51` has
      a stray `print(response)` left over from local debugging. Remove
      it. Do not introduce a logger call as a substitute — the surrounding
      `LangGraphChat.run()` method does not log elsewhere and adding one
