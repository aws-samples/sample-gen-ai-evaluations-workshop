  - id: T09_nav_retry_backoff_inventory
    title: Document retry/backoff configuration across the LLM and retrieval clients
    difficulty: medium
    skills: [navigation, architecture_review]
    affected_paths: []
    relevant_files:
      - src/agentic_platform/core/client/llm_gateway/bedrock_gateway_client.py
      - src/agentic_platform/core/client/llm_gateway/litellm_gateway_client.py
      - src/agentic_platform/service/retrieval_gateway/client/kb_client.py
    issue_description: |
      No code change. Produce a short inventory of the retry/backoff
      configuration across our outbound clients:

        1. `BedrockGatewayClient` — what's the current `max_attempts`
           setting and where (file + line)? Does it differ between the
           local and gateway paths?
        2. `LiteLLMGatewayClient` — what retry behaviour does it
           configure? (Hint: it uses `requests.post`; check whether any
           retry adapter is set up.)
        3. `BedrockKnowledgeBaseClient` (retrieval gateway) — does the
           module-level boto3 client get a retry config?

      For each, give file:line and the relevant config snippet. Identify
      which of the three is most exposed to throttling-induced failures.
    expected_tools:
      required: [grep]
      forbidden: []
    is_trap: false
    nav_only: true
    qa_pairs:
      - q: "Where is retry/backoff configured for the LLM and retrieval clients?"
        a: |
          - BedrockGatewayClient: max_attempts=1 on both paths — bedrock_gateway_client.py:33 (local) and :43 (gateway). No backoff mode set, so adaptive backoff is OFF.
          - LiteLLMGatewayClient: no retry adapter configured. requests.post is called directly at litellm_gateway_client.py:51 with no Session/Retry wrapper.
          - BedrockKnowledgeBaseClient: kb_client.py:14 constructs a default boto3 client with no Config — boto3's default retry policy applies (legacy mode, max 5 attempts), but it's incidental, not deliberate.
          The most exposed is BedrockGatewayClient — it explicitly turns retries OFF.
        relevant_files:
          - src/agentic_platform/core/client/llm_gateway/bedrock_gateway_client.py
          - src/agentic_platform/core/client/llm_gateway/litellm_gateway_client.py
          - src/agentic_platform/service/retrieval_gateway/client/kb_client.py
